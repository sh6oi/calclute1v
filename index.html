    body {

    * {
      font-family: 'Tajawal', sans-serif;

    .btn-gradient {
      background: linear-gradient(135deg, var(--primary-action) 0%, var(--secondary-action) 100%);
      transition: all 0.3s ease;
    }
    .btn-gradient:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }
    .btn-gradient:active {
      transform: translateY(0);
    }
    .active-btn {
      background: linear-gradient(135deg, var(--secondary-action) 0%, var(--primary-action) 100%) !important;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .iframe-container {
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .loading-spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>

  <script>
    const defaultConfig = {
      main_title: '🚀 لوحة التحكم',
      btn_new_order: 'اضافة ��لب جديد',
      btn_manage: 'ادارة الطلبات',
      btn_calculate: 'حساب السعر',
      background_color: '#1a1a2e',
      text_color: '#ffffff'
    };

    let config = { ...defaultConfig };
    let activeButton = null;

    function loadPage(url, button) {
      const placeholder = document.getElementById('placeholder');
      const loading = document.getElementById('loading');
      const iframe = document.getElementById('content-frame');
      const backContainer = document.getElementById('back-container');

      // Update active button state
      document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active-btn'));
      button.classList.add('active-btn');
      activeButton = button;

      // Show loading
      placeholder.classList.add('hidden');
      iframe.classList.add('hidden');
      loading.classList.remove('hidden');
      loading.classList.add('flex');

      // Load iframe
      setTimeout(() => {
        iframe.src = url;
        
        iframe.onload = function() {
          console.log('تم تحميل الصفحة بنجاح');
          loading.classList.add('hidden');
          loading.classList.remove('flex');
          iframe.classList.remove('hidden');
          backContainer.classList.remove('hidden');
        };

        iframe.onerror = function() {
          console.error('خطأ في تحميل الصفحة');
          loading.classList.add('hidden');
          loading.classList.remove('flex');
          placeholder.innerHTML = `
            <div class="text-6xl mb-4">⚠️</div>
            <h2 class="text-xl font-bold text-white mb-2">حدث خطأ</h2>
            <p class="text-gray-300">الرابط: ${url}</p>
            <p class="text-gray-300 text-sm mt-2">قد تكون الصفحة غير متاحة حالياً</p>
          `;
          placeholder.classList.remove('hidden');
          backContainer.classList.remove('hidden');
        };
      }, 100);
    }

    function goBack() {
      const placeholder = document.getElementById('placeholder');
      const iframe = document.getElementById('content-frame');
      const backContainer = document.getElementById('back-container');

      iframe.classList.add('hidden');
      iframe.src = '';
      backContainer.classList.add('hidden');
      
      placeholder.innerHTML = `
        <div class="text-6xl md:text-8xl mb-4">📋</div>
        <h2 class="text-xl md:text-2xl font-bold text-white mb-2">مرحباً بك!</h2>
        <p class="text-gray-300 text-sm md:text-base">اضغط على أحد الأزرار أعلاه لعرض المحتوى</p>
      `;
      placeholder.classList.remove('hidden');

      // Remove active state from buttons
      document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active-btn'));
      activeButton = null;
    }

    async function onConfigChange(cfg) {
      config = { ...defaultConfig, ...cfg };
      
      // Update title
      document.getElementById('main-title').textContent = config.main_title || defaultConfig.main_title;
      
      // Update button texts
      const btnNewOrder = document.querySelector('#btn-new-order span');
      const btnManage = document.querySelector('#btn-manage span');
      const btnCalculate = document.querySelector('#btn-calculate span');
      
      if (btnNewOrder) btnNewOrder.textContent = config.btn_new_order || defaultConfig.btn_new_order;
      if (btnManage) btnManage.textContent = config.btn_manage || defaultConfig.btn_manage;
      if (btnCalculate) btnCalculate.textContent = config.btn_calculate || defaultConfig.btn_calculate;
    }

    function mapToCapabilities(cfg) {
      return {
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }

    function mapToEditPanelValues(cfg) {
      return new Map([
        ['main_title', cfg.main_title || defaultConfig.main_title],
        ['btn_new_order', cfg.btn_new_order || defaultConfig.btn_new_order],
        ['btn_manage', cfg.btn_manage || defaultConfig.btn_manage],
        ['btn_calculate', cfg.btn_calculate || defaultConfig.btn_calculate]
      ]);
    }

    // Initialize SDK
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
    }
  </script>
